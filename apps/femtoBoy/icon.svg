<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect x="0" y="0" width="96" height="96" fill="#3b3b3b"/>
  <rect x="22" y="8" width="52" height="80" rx="6" fill="#e8ead9"/>
  <rect x="28" y="16" width="40" height="34" rx="2" fill="#0f380f"/>
  <rect x="31" y="19" width="34" height="28" rx="1" fill="#9bbc0f"/>

  <!-- D-pad: a plus/cross shape, left side, kept inside the console body (x >= 22) -->
  <rect x="29" y="59" width="8" height="18" fill="#333"/>
  <rect x="24" y="64" width="18" height="8" fill="#333"/>

  <!-- A/B buttons, right side, offset diagonally like a real GameBoy -->
  <circle cx="68" cy="61" r="5" fill="#5a5a5a"/>
  <circle cx="57" cy="70" r="5" fill="#5a5a5a"/>

  <!-- Select/Start -->
  <circle cx="42" cy="80" r="3" fill="#7a1f3d"/>
  <circle cx="52" cy="80" r="3" fill="#7a1f3d"/>
</svg>
